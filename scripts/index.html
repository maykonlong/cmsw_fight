<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>AI Sprite Extractor - CMSW — Combat Martial Soul Warriors</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #16213e; padding: 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #e94560; }
        .drop-zone { border: 2px dashed #0f3460; padding: 40px; margin: 20px 0; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .drop-zone:hover { background: #0f3460; }
        canvas { border: 1px solid #444; margin-top: 20px; background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAMUlEQVQ4T2NkYNgfRMZgAKRAG5j/E02QZBhNMIwmwHEI0/8nmgDSMBpGM4zDCBgwMAAAW0AG0812zQsAAAAASUVORK5CYII='); }
        button { background: #e94560; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 20px; }
        button:hover { background: #d03050; }
        #status { color: #00ff00; margin-top: 10px; }
    </style>
    <!-- Usando a versão de Browser do @imgly/background-removal -->
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.3/dist/imgly-background-removal.js"></script>
</head>
<body>
    <div class="container">
        <h1>✂️ CMSW Sprite Extractor (IA)</h1>
        <p>Como a sua pasta local tem um caractere "&" (C&M), o Windows bloqueia a instalação de bibliotecas pesadas de IA. Por isso, criei este Extrator via Navegador!</p>
        
        <div class="drop-zone" id="drop-zone">
            Arraste a foto do Vini Dog ou do Kevin aqui<br><br>Ou clique para selecionar
            <input type="file" id="file-input" style="display: none;" accept="image/jpeg, image/png">
        </div>
        
        <div id="status"></div>
        <canvas id="canvas" style="display: none;"></canvas>
        <button id="download-btn" style="display: none;">Baixar Spritesheet</button>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const statusEl = document.getElementById('status');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('download-btn');
        let currentFileName = '';

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = '#0f3460'; });
        dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.style.background = 'transparent'; });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.background = 'transparent';
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        async function handleFile(file) {
            if (!file) return;
            currentFileName = file.name.split('.')[0].toLowerCase();
            statusEl.innerText = "⏳ Baixando Modelo de IA na sua memória RAM e Removendo Fundo... (Pode demorar uns 20s na 1ª vez)";
            
            try {
                // imglyRemoveBackground está exposto globalmente pelo script CDN
                const blob = await imglyRemoveBackground(file);
                const url = URL.createObjectURL(blob);
                
                const img = new Image();
                img.onload = () => {
                    // Prepara um Canvas de Spritesheet no padrão do jogo: 64x128
                    canvas.width = 64;
                    canvas.height = 128;
                    canvas.style.display = 'block';
                    
                    // Centralizar e redimensionar mantendo proporção (Contain)
                    const scale = Math.min(64 / img.width, 128 / img.height);
                    const drawWidth = img.width * scale;
                    const drawHeight = img.height * scale;
                    const offsetX = (64 - drawWidth) / 2;
                    const offsetY = (128 - drawHeight); // Grudar os pés no chão da Hitbox
                    
                    ctx.clearRect(0, 0, 64, 128);
                    ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
                    
                    statusEl.innerText = "✅ Recorte Perfeito! Spritesheet 64x128 criado.";
                    downloadBtn.style.display = 'inline-block';
                };
                img.src = url;
            } catch (err) {
                statusEl.innerText = "❌ Erro ao remover fundo: " + err.message;
            }
        }

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = currentFileName + '_spritesheet.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
